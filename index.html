<div id="settings" class="hidden" style="position:fixed;inset:0;z-index:100;background:#0008;padding:20px;overflow:auto"><div class="card" style="max-width:620px;margin:30px auto"><div class="title">クラウド共有設定</div><label>チームコード</label><input id="teamCode" placeholder="例：SXT-KANRI2" autocomplete="off" autocapitalize="characters"><div class="notice" style="margin-top:10px">同じチームコードを入力した端末同士で、物件・写真・検査記録を共有します。Supabaseの接続設定はアプリに登録済みです。</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="saveSettings()">利用開始</button><button class="btn light" onclick="closeSettings()">閉じる</button></div></div></div><div id="footer" class="footer hidden"><button class="btn light" onclick="showList()">物件一覧</button><button class="btn" onclick="saveProject(true)">保存</button><button class="btn" onclick="outputPDF()">PDF出力</button></div>
<script>
const DB='sxtInspectionDB', STORE='projects'; let db,current=null,saveTimer=null;
const CFG='sxtCloudCfg', DEFAULT_SB_URL='https://vvnbjhffuvgwpqmrvofz.supabase.co', DEFAULT_SB_KEY='sb_publishable_VqnFaUxYvfbBqX0TNDyi-g_5gCMtrq5'; let savedCfg=JSON.parse(localStorage.getItem(CFG)||'{}'); let cfg={url:DEFAULT_SB_URL,key:DEFAULT_SB_KEY,team:savedCfg.team||''}; localStorage.setItem(CFG,JSON.stringify(cfg));
function openSettings(){teamCode.value=cfg.team||'';settings.classList.remove('hidden');setTimeout(()=>teamCode.focus(),100)}
function closeSettings(){settings.classList.add('hidden')}
async function saveSettings(){let team=teamCode.value.trim();if(!team)return alert('チームコードを入力してください。');cfg={url:DEFAULT_SB_URL,key:DEFAULT_SB_KEY,team};localStorage.setItem(CFG,JSON.stringify(cfg));closeSettings();setBadge();await renderList();alert('クラウド共有を有効にしました。')}
function cloudOn(){return !!(cfg.url&&cfg.key&&cfg.team)}
function setBadge(){cloudBadge.textContent=cloudOn()?'☁ クラウド共有':'端末保存';}
function headers(extra={}){return {'apikey':cfg.key,'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json',...extra}}
async function cloudFetch(path,opt={}){let r=await fetch(cfg.url+'/rest/v1/'+path,{...opt,headers:headers(opt.headers||{})});if(!r.ok)throw new Error(await r.text());if(r.status===204)return null;let t=await r.text();return t?JSON.parse(t):null}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function localAll(){return new Promise((res,rej)=>{let r=tx().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function localPut(o){return new Promise((res,rej)=>{let r=tx('readwrite').put(o);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function localDel(id){return new Promise((res,rej)=>{let r=tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function getAll(){if(!cloudOn())return localAll();try{let a=await cloudFetch('projects?team_code=eq.'+encodeURIComponent(cfg.team)+'&select=data&order=updated_at.desc');return a.map(x=>x.data)}catch(e){console.error(e);alert('クラウド接続に失敗したため、この端末の保存データを表示します。');return localAll()}}
async function put(o){await localPut(o);if(!cloudOn())return;await cloudFetch('projects?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:o.id,team_code:cfg.team,updated_at:new Date(o.updated).toISOString(),data:o})})}
async function del(id){await localDel(id);if(cloudOn())await cloudFetch('projects?id=eq.'+encodeURIComponent(id)+'&team_code=eq.'+encodeURIComponent(cfg.team),{method:'DELETE',headers:{'Prefer':'return=minimal'}})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function renderList(){setBadge();let a=await getAll();a.sort((x,y)=>(y.updated||0)-(x.updated||0));projectList.innerHTML=a.length?a.map(p=>`<div class="project-row"><div><div class="project-name">${esc(p.name||'名称未入力')}</div><div class="meta">検査日：${esc(p.inspection||'未設定')}　写真 ${countPhotos(p)}枚</div></div><button class="btn light" onclick="openProject('${p.id}')">開く</button></div>`).join(''):'<div class="empty">保存された物件はありません。<br>「＋ 新規物件」から開始してください。</div>'}
function countPhotos(p){return (p.photoSections||[]).reduce((n,s)=>n+(s.photos||[]).length,0)}
function blank(){return {id:uid(),name:'',inspection:new Date().toISOString().slice(0,10),attendees:'',author:'',photoSections:[{id:uid(),desc:'',category:'',photos:[]}],updated:Date.now()}}
function newProject(){current=blank();renderEditor();showEdit()}
async function openProject(id){let all=await getAll();current=all.find(x=>x.id===id);if(!current)return alert('物件を取得できませんでした。');renderEditor();showEdit()}
function showEdit(){listView.classList.add('hidden');editView.classList.remove('hidden');footer.classList.remove('hidden');scrollTo(0,0)}
async function showList(){await saveProject(false);editView.classList.add('hidden');footer.classList.add('hidden');listView.classList.remove('hidden');await renderList();scrollTo(0,0)}
function renderEditor(){projectName.value=current.name||'';inspection.value=current.inspection||'';attendees.value=current.attendees||'';author.value=current.author||'';photoSections.innerHTML='';(current.photoSections||[]).forEach(s=>renderPhotoSection(s));bindAuto()}
function renderPhotoSection(s){let d=document.createElement('div');d.className='photo-section';d.dataset.id=s.id;d.innerHTML=`<div class="photo-head"><div class="photo-fields"><div><label>場所・内容</label><input class="sd" value="${esc(s.desc||'')}" placeholder="例：厨房入口・壁クロス"></div><div class="category-field"><label>区分</label><input class="sc" value="${esc(s.category||'')}" placeholder="自由入力"></div></div><div class="actions no-print"><button class="btn light" onclick="pickPhoto('${s.id}','before',true)">📷 作業前</button><button class="btn light" onclick="pickPhoto('${s.id}','after',true)">📷 作業後</button><button class="btn red" onclick="removeSection('${s.id}')">削除</button></div></div><div class="gallery" id="g_${s.id}"></div>`;photoSections.appendChild(d);renderGallery(s)}
function renderGallery(s){let g=document.getElementById('g_'+s.id);g.innerHTML='';let photos=s.photos||[];photos.forEach(p=>{let d=document.createElement('div');d.className='shot';d.innerHTML=`<img src="${p.data}"><div class="photo-type" style="padding:7px 7px 0;font-size:12px;font-weight:900;color:#111">${p.type==='before'?'作業前':'作業後'}</div><textarea placeholder="写真コメント" oninput="photoComment('${s.id}','${p.id}',this.value)">${esc(p.comment||'')}</textarea><div class="shotbar no-print"><button class="btn gray" onclick="replacePhoto('${s.id}','${p.id}')">差替</button><button class="btn red" onclick="removePhoto('${s.id}','${p.id}')">削除</button></div>`;g.appendChild(d)});['before','after'].forEach(type=>{if(!photos.some(p=>p.type===type)){let ph=document.createElement('div');ph.className='shot print-placeholder';ph.innerHTML=`<div class="placeholder-box"></div><div class="photo-type">${type==='before'?'作業前':'作業後'}</div><div class="placeholder-comment"></div>`;g.appendChild(ph)}});let add=document.createElement('div');add.className='addphoto no-print';add.innerHTML=`<div class="big">＋</div><div>写真を複数枚追加</div><div class="actions" style="margin-top:10px"><button class="btn" onclick="pickPhoto('${s.id}','before',false)">作業前</button><button class="btn light" onclick="pickPhoto('${s.id}','after',false)">作業後</button></div>`;g.appendChild(add)}
function addPhotoSection(){syncFromDOM();current.photoSections.push({id:uid(),desc:'',category:'',photos:[]});renderEditor();scheduleSave()}
function removeSection(id){if(confirm('この場所の写真記録を削除しますか？')){syncFromDOM();current.photoSections=current.photoSections.filter(x=>x.id!==id);renderEditor();scheduleSave()}}
function picker(capture,multiple,cb){let i=document.createElement('input');i.type='file';i.accept='image/*';if(capture)i.setAttribute('capture','environment');if(multiple)i.multiple=true;i.onchange=()=>cb([...i.files]);i.click()}
function pickPhoto(sid,type,camera){syncFromDOM();picker(camera,!camera,async files=>{for(const f of files){let data=await compress(f);let s=current.photoSections.find(x=>x.id===sid);s.photos.push({id:uid(),type,data,comment:''})}renderEditor();await saveProject(false)})}
function replacePhoto(sid,pid){syncFromDOM();picker(false,false,async files=>{if(!files[0])return;let data=await compress(files[0]);let p=current.photoSections.find(x=>x.id===sid).photos.find(x=>x.id===pid);p.data=data;renderEditor();await saveProject(false)})}
function removePhoto(sid,pid){syncFromDOM();let s=current.photoSections.find(x=>x.id===sid);s.photos=s.photos.filter(x=>x.id!==pid);renderEditor();scheduleSave()}
function photoComment(sid,pid,v){let p=current.photoSections.find(x=>x.id===sid).photos.find(x=>x.id===pid);p.comment=v;scheduleSave()}
function compress(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let max=1400,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.68))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function syncFromDOM(){if(!current)return;current.name=projectName.value;current.inspection=inspection.value;current.attendees=attendees.value;current.author=author.value;document.querySelectorAll('.photo-section').forEach(el=>{let s=current.photoSections.find(x=>x.id===el.dataset.id);if(s){s.desc=el.querySelector('.sd').value;s.category=el.querySelector('.sc')?.value||''}});current.updated=Date.now()}
async function saveProject(show){if(!current)return;syncFromDOM();try{await put(current);if(show){let b=document.querySelector('.footer .btn:nth-child(2)'),old=b.textContent;b.textContent='保存済 ✓';setTimeout(()=>b.textContent=old,900)}}catch(e){console.error(e);alert('保存に失敗しました。クラウド設定・通信状態・保存容量をご確認ください。')}}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveProject(false),700)}
function bindAuto(){document.querySelectorAll('#editView input,#editView textarea,#editView select').forEach(x=>{x.addEventListener('input',scheduleSave);x.addEventListener('change',scheduleSave)})}
async function deleteProject(){if(!current)return;if(confirm('この物件の記録をすべて削除しますか？')){await del(current.id);current=null;editView.classList.add('hidden');footer.classList.add('hidden');listView.classList.remove('hidden');renderList()}}
function compressForPDF(src,max=1100,quality=.55){return new Promise(res=>{let im=new Image();im.onload=()=>{let scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));let x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',quality))};im.onerror=()=>res(src);im.src=src})}
async function outputPDF(){await saveProject(false);document.activeElement?.blur?.();document.querySelectorAll('.category-field').forEach(f=>f.classList.toggle('print-empty',!(f.querySelector('.sc')?.value||'').trim()));pName.textContent=current.name||'—';pDate.textContent=current.inspection||'—';pAttendees.textContent=current.attendees||'—';pAuthor.textContent=current.author||'—';document.getElementById('printDate').textContent=(current.inspection||'');let imgs=[...document.querySelectorAll('#photoSections .shot img')], originals=imgs.map(i=>i.src);if((document.getElementById('pdfQuality')?.value||'standard')==='standard'){await Promise.all(imgs.map(async i=>{i.src=await compressForPDF(i.src,1100,.55)}));await Promise.all(imgs.map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve()))}let restore=()=>{imgs.forEach((i,n)=>i.src=originals[n]);window.removeEventListener('afterprint',restore)};window.addEventListener('afterprint',restore);setTimeout(()=>window.print(),250)}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
openDB().then(()=>{setBadge();renderList()}).catch(()=>alert('端末保存を利用できません。Safariで開いてください。'));
</script></body></html>

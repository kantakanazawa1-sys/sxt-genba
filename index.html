<div id="settings" class="hidden" style="position:fixed;inset:0;z-index:100;background:#0008;padding:20px;overflow:auto"><div class="card" style="max-width:620px;margin:30px auto"><div class="title">クラウド共有設定</div><label>チームコード</label><input id="teamCode" placeholder="例：SXT-KANRI2" autocomplete="off" autocapitalize="characters"><div class="notice" style="margin-top:10px">同じチームコードを入力した端末同士で、物件・写真・検査記録を共有します。Supabaseの接続設定はアプリに登録済みです。</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="saveSettings()">利用開始</button><button class="btn light" onclick="closeSettings()">閉じる</button></div></div></div><div id="footer" class="footer hidden"><button class="btn light" onclick="showList()">物件一覧</button><button class="btn" onclick="saveProject(true)">保存</button><button class="btn" onclick="outputPDF()">PDF出力</button></div>
<script>
const DB='sxtInspectionDB', STORE='projects'; let db,current=null,saveTimer=null;
const CFG='sxtCloudCfg', TEAM_BACKUP='sxtCloudTeam', CLOUD_ENABLED='sxtCloudEnabled', DEFAULT_SB_URL='https://vvnbjhffuvgwpqmrvofz.supabase.co', DEFAULT_SB_KEY='sb_publishable_VqnFaUxYvfbBqX0TNDyi-g_5gCMtrq5';
// アップデート時も既存端末のクラウド設定を維持する。空の初期値で既存設定を上書きしない。
let savedCfg={};try{savedCfg=JSON.parse(localStorage.getItem(CFG)||'{}')||{}}catch(e){console.error('cloud cfg parse failed',e)}
const rememberedTeam=(savedCfg.team||localStorage.getItem(TEAM_BACKUP)||'').trim();
let cfg={url:DEFAULT_SB_URL,key:DEFAULT_SB_KEY,team:rememberedTeam};
if(rememberedTeam){localStorage.setItem(CFG,JSON.stringify(cfg));localStorage.setItem(TEAM_BACKUP,rememberedTeam);localStorage.setItem(CLOUD_ENABLED,'1')}
function openSettings(){teamCode.value=cfg.team||'';settings.classList.remove('hidden');setTimeout(()=>teamCode.focus(),100)}
function closeSettings(){settings.classList.add('hidden')}
async function saveSettings(){
  let team=teamCode.value.trim();if(!team)return alert('チームコードを入力してください。');
  const oldTeam=cfg.team||'';
  let localBefore=[];try{localBefore=await localAll()}catch(e){console.error(e)}
  cfg={url:DEFAULT_SB_URL,key:DEFAULT_SB_KEY,team};localStorage.setItem(CFG,JSON.stringify(cfg));localStorage.setItem(TEAM_BACKUP,team);localStorage.setItem(CLOUD_ENABLED,'1');closeSettings();setBadge();
  // 端末保存から初めてクラウド共有へ切り替える時は、既存データを消さずにクラウドへコピーする。
  if(!oldTeam&&localBefore.length){
    let ok=0,fail=0;
    for(const o of localBefore){
      try{await uploadOneToCloud(o);ok++}catch(e){console.error('initial cloud migration failed',e);fail++;cloudLastError=e}
    }
    setBadge();await renderList();
    alert(fail?`クラウド共有を有効にしました。端末データ ${ok}件を共有しました。${fail}件は端末に残っており、再保存すると再送信されます。`:`クラウド共有を有効にしました。端末に保存していた ${ok}件もそのままクラウドへ引き継ぎました。`);
    return;
  }
  await renderList();alert('クラウド共有を有効にしました。端末保存データはそのまま残ります。');
}
function cloudOn(){return !!(cfg.url&&cfg.key&&cfg.team)}
function setBadge(){
  if(!cloudOn()){cloudBadge.textContent='端末保存';return}
  cloudBadge.textContent=cloudLastError?'☁ クラウド共有・再接続中':'☁ クラウド共有';
}
function headers(extra={}){return {'apikey':cfg.key,'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json',...extra}}
async function cloudFetch(path,opt={}){let r=await fetch(cfg.url+'/rest/v1/'+path,{...opt,headers:headers(opt.headers||{})});if(!r.ok)throw new Error(await r.text());if(r.status===204)return null;let t=await r.text();return t?JSON.parse(t):null}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function localAll(){return new Promise((res,rej)=>{let r=tx().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function localPut(o){return new Promise((res,rej)=>{let r=tx('readwrite').put(o);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function localDel(id){return new Promise((res,rej)=>{let r=tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function getAll(){
  const local=await localAll();
  if(!cloudOn())return local;
  try{
    const a=await cloudFetch('projects?team_code=eq.'+encodeURIComponent(cfg.team)+'&select=data&order=updated_at.desc');
    const cloud=(a||[]).map(x=>x.data).filter(Boolean);
    // クラウドへ切り替えても端末データを一覧から消さない。IDが同じ場合は更新日時が新しい方を採用する。
    const map=new Map(local.map(o=>[o.id,o]));
    for(const o of cloud){
      const l=map.get(o.id);
      const chosen=!l||Number(o.updated||0)>Number(l.updated||0)?o:l;
      map.set(o.id,chosen);
      if(chosen===o){try{await localPut(o)}catch(e){console.error('cloud cache failed',e)}}
    }
    cloudLastError=null;setBadge();return [...map.values()];
  }catch(e){console.error('cloud list failed',e);cloudLastError=e;setBadge();return local}
}
let cloudSaveTimer=null,cloudSaveBusy=false,cloudPending=null,cloudLastError=null;
async function uploadOneToCloud(o){if(!cloudOn()||!o)return;return cloudFetch('projects?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:o.id,team_code:cfg.team,updated_at:new Date(o.updated||Date.now()).toISOString(),data:o})})}
async function flushCloudSave(){
  if(cloudSaveBusy||!cloudPending||!cloudOn())return;
  cloudSaveBusy=true;
  const o=cloudPending; cloudPending=null;
  try{
    await uploadOneToCloud(o);
    cloudLastError=null;
    setBadge();
  }catch(e){
    console.error('cloud save failed',e);
    cloudLastError=e;
    cloudPending=o;
    setBadge();
  }finally{
    cloudSaveBusy=false;
    if(cloudPending&&cloudOn()){
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer=setTimeout(flushCloudSave,5000);
    }
  }
}
function queueCloudSave(o,immediate=false){
  if(!cloudOn())return;
  cloudPending=(typeof structuredClone==='function')?structuredClone(o):JSON.parse(JSON.stringify(o));
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(flushCloudSave,immediate?0:1500);
}
async function put(o){await localPut(o);queueCloudSave(o,false)}
async function del(id){await localDel(id);if(cloudOn())await cloudFetch('projects?id=eq.'+encodeURIComponent(id)+'&team_code=eq.'+encodeURIComponent(cfg.team),{method:'DELETE',headers:{'Prefer':'return=minimal'}})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

function normalizeBreaks(v=''){return String(v??'').replace(/\\n/g,'\n').replace(/\/n/g,'\n')}
function esc(s=''){return normalizeBreaks(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function renderList(){
  setBadge();
  let a=await getAll();
  a.sort((x,y)=>(y.updated||0)-(x.updated||0));

  const active=a.filter(p=>(p.status||'active')!=='done');
  const done=a.filter(p=>(p.status||'active')==='done');

  function projectRow(p,isDone){
    const moveLabel=isDone?'進行中へ戻す':'完了へ移動';
    const moveClass=isDone?'btn light':'btn';
    return `<div class="project-row">
      <div>
        <div class="project-name">${esc(p.name||'名称未入力')}</div>
        <div class="meta">検査日：${esc(p.inspection||'未設定')}　写真 ${countPhotos(p)}枚</div>
      </div>
      <div class="project-list-actions">
        <button class="btn light" onclick="openProject('${p.id}')">開く</button>
        <button class="${moveClass}" onclick="moveProjectStatus('${p.id}','${isDone?'active':'done'}')">${moveLabel}</button>
      </div>
    </div>`;
  }

  function group(title,items,isDone){
    const key=isDone?'done':'active';
    return `<div class="project-group ${isDone?'done-group':'active-group'}">
      <button type="button" class="project-group-title project-folder-button"
        onclick="toggleProjectFolder('${key}',this)" aria-expanded="false">
        <span class="folder-label"><span class="folder-icon">📁</span>${title}</span>
        <span class="folder-right"><span class="folder-count">${items.length}件</span><span class="folder-arrow">›</span></span>
      </button>
      <div class="project-folder-body" data-folder="${key}" hidden>
        ${items.length?items.map(p=>projectRow(p,isDone)).join(''):`<div class="empty small-empty">${title}はありません。</div>`}
      </div>
    </div>`;
  }

  projectList.innerHTML=
    group('進行中物件',active,false)+
    group('完了物件',done,true);
}

function toggleProjectFolder(key,btn){
  const body=document.querySelector('.project-folder-body[data-folder="'+key+'"]');
  if(!body)return;
  const willOpen=body.hasAttribute('hidden');
  if(willOpen) body.removeAttribute('hidden');
  else body.setAttribute('hidden','');
  btn.setAttribute('aria-expanded',willOpen?'true':'false');
}

async function moveProjectStatus(id,status){
  let all=await getAll();
  let p=all.find(x=>x.id===id);
  if(!p)return alert('物件を取得できませんでした。');
  p.status=status;
  p.updated=Date.now();
  await put(p);
  await renderList();
}

function ensureSectionRows(s){
  if(Array.isArray(s.rows)&&s.rows.length)return s.rows;
  const photos=s.photos||[],befores=photos.filter(p=>p.type==='before'),afters=photos.filter(p=>p.type==='after');
  const n=Math.max(1,befores.length,afters.length);
  s.rows=[];
  for(let i=0;i<n;i++)s.rows.push({id:uid(),before:befores[i]?{mode:'photo',photo:befores[i],text:'',size:'medium'}:{mode:(i===0&&s.beforeWorkDate)?'text':'photo',photo:null,text:i===0?(s.beforeWorkDate||''):'',size:s.beforeTextSize||'medium'},after:afters[i]?{mode:'photo',photo:afters[i],text:'',size:'medium'}:{mode:(i===0&&s.afterWorkDate)?'text':'photo',photo:null,text:i===0?(s.afterWorkDate||''):'',size:s.afterTextSize||'medium'}});
  return s.rows;
}
let expandedSectionId=null;
function sectionSummaryInfo(s){
  const rows=ensureSectionRows(s); let photos=0,texts=0;
  rows.forEach(r=>['before','after'].forEach(side=>{const x=r[side]||{};if(x.mode==='photo'&&x.photo)photos++;if(x.mode==='text'&&(x.text||'').trim())texts++}));
  const bits=[]; if(photos)bits.push('写真'+photos); if(texts)bits.push('文字'+texts); if(!bits.length)bits.push('未入力');
  return {rows:rows.length,detail:bits.join('・')};
}

function renderGallery(s){let g=document.getElementById('g_'+s.id);g.innerHTML='';const rows=ensureSectionRows(s);rows.forEach((r,i)=>{let d=document.createElement('div');d.className='slot-row'+(r.layout==='full'?' full-layout':'');d.dataset.rowId=r.id;const full=r.layout==='full';d.innerHTML=`<div class="slot-row-head no-print"><div class="slot-row-no">掲載段 ${i+1}</div><button class="row-layout ${r.noteMode?'note-active':''}" onclick="toggleRowNote('${s.id}','${r.id}')">${r.noteMode?'NOTE':'通常'}</button><button class="row-layout" onclick="toggleRowLayout('${s.id}','${r.id}')">${full?'左右2分割':'1枚全面'}</button><button class="row-move" onclick="moveSlotRow('${s.id}','${r.id}',-1)" ${i===0?'disabled':''}>↑</button><button class="row-move" onclick="moveSlotRow('${s.id}','${r.id}',1)" ${i===rows.length-1?'disabled':''}>↓</button>${rows.length>1?`<button class="row-delete-mini" onclick="removeSlotRow('${s.id}','${r.id}')">段削除</button>`:'<span></span>'}</div><div class="slot-grid">${slotHtml(s,r,'before')}${full?'':slotHtml(s,r,'after')}</div>`;g.appendChild(d)})}

function moveSlotRow(sid,rid,dir){syncFromDOM();const s=current.photoSections.find(x=>x.id===sid);if(!s)return;const rows=ensureSectionRows(s),i=rows.findIndex(x=>x.id===rid),j=i+dir;if(i<0||j<0||j>=rows.length)return;[rows[i],rows[j]]=[rows[j],rows[i]];renderEditor();scheduleSave()}

function initSectionDrag(card){

  let pressTimer=null,startY=0,startX=0,active=false;
  const clear=()=>{clearTimeout(pressTimer);pressTimer=null;if(active){active=false;sectionDragId=null;card.classList.remove('dragging');document.querySelectorAll('.photo-section').forEach(x=>x.classList.remove('drag-over'))}};
  h.addEventListener('touchstart',e=>{if(card.classList.contains('expanded')||e.touches.length!==1)return;startY=e.touches[0].clientY;startX=e.touches[0].clientX;pressTimer=setTimeout(()=>{active=true;sectionDragId=card.dataset.id;card.classList.add('dragging');if(navigator.vibrate)navigator.vibrate(25)},420)},{passive:true});
  h.addEventListener('touchmove',e=>{if(!pressTimer&&!active)return;const t=e.touches[0];if(!active){if(Math.abs(t.clientY-startY)>10||Math.abs(t.clientX-startX)>10)clear();return}e.preventDefault();const el=document.elementFromPoint(t.clientX,t.clientY),target=el&&el.closest('.photo-section');document.querySelectorAll('.photo-section').forEach(x=>x.classList.remove('drag-over'));if(target&&target!==card&&!target.classList.contains('expanded'))target.classList.add('drag-over');if(t.clientY<105)window.scrollBy(0,-12);else if(t.clientY>window.innerHeight-120)window.scrollBy(0,12)},{passive:false});
  h.addEventListener('touchend',e=>{if(active){const t=e.changedTouches[0],el=document.elementFromPoint(t.clientX,t.clientY),target=el&&el.closest('.photo-section');if(target&&target!==card)reorderSectionByIds(card.dataset.id,target.dataset.id)}else{clearTimeout(pressTimer)}clear()});
  h.addEventListener('touchcancel',clear);
}
function addPhotoSection(){syncFromDOM();const n={id:uid(),desc:'',category:'',photos:[]};current.photoSections.push(n);expandedSectionId=n.id;renderEditor();scheduleSave();setTimeout(()=>document.querySelector(`.photo-section[data-id="${n.id}"]`)?.scrollIntoView({behavior:'smooth',block:'start'}),30)}
function sectionEmptyText(sid,type,v){let s=current.photoSections.find(x=>x.id===sid);if(s){if(type==='before')s.beforeWorkDate=(v||'').slice(0,120);else s.afterWorkDate=(v||'').slice(0,120);scheduleSave()}}
function sectionEmptyTextSize(sid,type,v){let s=current.photoSections.find(x=>x.id===sid);if(s){if(type==='before')s.beforeTextSize=v;else s.afterTextSize=v;scheduleSave()}}
function removeSection(id){if(confirm('この場所の写真記録を削除しますか？')){syncFromDOM();current.photoSections=current.photoSections.filter(x=>x.id!==id);if(expandedSectionId===id)expandedSectionId=null;renderEditor();scheduleSave()}}
function picker(capture,multiple,cb){let i=document.createElement('input');i.type='file';i.accept='image/*';if(capture)i.setAttribute('capture','environment');if(multiple)i.multiple=true;i.onchange=()=>cb([...i.files]);i.click()}
function pickPhoto(sid,type,camera){syncFromDOM();picker(camera,!camera,async files=>{for(const f of files){let data=await compress(f);let s=current.photoSections.find(x=>x.id===sid);s.photos.push({id:uid(),type,data,comment:''})}renderEditor();await saveProject(false)})}
function replacePhoto(sid,pid){syncFromDOM();picker(false,false,async files=>{if(!files[0])return;let data=await compress(files[0]);let p=current.photoSections.find(x=>x.id===sid).photos.find(x=>x.id===pid);p.data=data;renderEditor();await saveProject(false)})}
function removePhoto(sid,pid){syncFromDOM();let s=current.photoSections.find(x=>x.id===sid);s.photos=s.photos.filter(x=>x.id!==pid);renderEditor();scheduleSave()}
function photoComment(sid,pid,v){let p=current.photoSections.find(x=>x.id===sid).photos.find(x=>x.id===pid);p.comment=v;scheduleSave()}
function compress(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let max=1400,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.68))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function syncFromDOM(){if(!current)return;current.reportTitle=reportTitleInput.value||'現場検査記録';current.name=projectName.value;current.inspection=inspection.value;current.attendees=attendees.value;current.author=author.value;document.querySelectorAll('.photo-section').forEach(el=>{let s=current.photoSections.find(x=>x.id===el.dataset.id);if(s){s.desc=el.querySelector('.sd').value;s.category=el.querySelector('.sc')?.value||''}});current.updated=Date.now()}
async function saveProject(show){if(!current)return;syncFromDOM();try{
  await localPut(current);
  queueCloudSave(current,!!show);
  if(show){
    let b=document.querySelector('.footer .btn:nth-child(2)'),old=b.textContent;
    b.textContent='端末保存済 ✓';
    setTimeout(()=>b.textContent=old,900);
  }
}catch(e){
  console.error('local save failed',e);
  alert('この端末への保存に失敗しました。端末の空き容量をご確認ください。');
}}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveProject(false),1200)}
function bindAuto(){document.querySelectorAll('#editView input,#editView textarea,#editView select').forEach(x=>{if(x.dataset.autosaveBound)return;x.dataset.autosaveBound='1';x.addEventListener('input',scheduleSave,{passive:true});x.addEventListener('change',scheduleSave,{passive:true})})}
async function deleteProject(){if(!current)return;if(confirm('この物件の記録をすべて削除しますか？')){await del(current.id);current=null;editView.classList.add('hidden');footer.classList.add('hidden');listView.classList.remove('hidden');renderList()}}
function compressForPDF(src,max=1100,quality=.55){return new Promise(res=>{let im=new Image();im.onload=()=>{let scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));let x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',quality))};im.onerror=()=>res(src);im.src=src})}
function buildPrintPhotoPages(){
  const root=document.getElementById('printPhotoPages');
  if(!root||!current)return;
  root.innerHTML='';
  const rows=[];
  const slotHasContent=sl=>!!(sl&&((sl.mode==='photo'&&sl.photo&&sl.photo.data)||(sl.mode==='text'&&sl.text&&sl.text.trim())));

  (current.photoSections||[]).forEach(s=>{
    // 場所・内容が未入力の項目はPDFへ出さない
    if(!(s.desc||'').trim())return;
    const sr=ensureSectionRows(s)||[];
    const usable=sr.filter(rr=>{
      if((rr.layout||'split')==='full')return slotHasContent(rr.before);
      return slotHasContent(rr.before)||slotHasContent(rr.after);
    });
    usable.forEach((rr,k)=>rows.push({
      desc:s.desc||'', category:s.category||'',
      before:rr.before||{}, after:rr.after||{}, layout:rr.layout||'split', noteMode:!!rr.noteMode,
      continuation:k>0, lastContinuation:k===usable.length-1
    }));
  });

  for(let i=0;i<rows.length;i+=3){
    const page=document.createElement('div');
    page.className='print-photo-page';
    rows.slice(i,i+3).forEach(r=>{
      const row=document.createElement('div');
      row.className='print-photo-row'+(r.noteMode?' print-note-row':'')+(r.continuation?' print-photo-row-continuation':'')+(r.lastContinuation?' print-photo-row-last':'');

      const head=document.createElement('div');
      head.className='print-row-head';
      const d=document.createElement('div');
      d.textContent=(r.desc||'').trim();
      const c=document.createElement('div');
      c.textContent=(!r.continuation&&r.category&&r.category.trim())?r.category.trim():'';
      head.append(d,c);
      row.appendChild(head);

      const gal=document.createElement('div');
      gal.className='print-row-gallery'+(r.layout==='full'?' full':'');
      const sides=r.layout==='full'?['before']:['before','after'];
      sides.forEach((side,j)=>{
        const sl=r[side]||{},box=document.createElement('div');
        box.className='print-shot '+(side==='before'?'print-shot-before':'print-shot-after');
        if(sl.mode==='photo'&&sl.photo&&sl.photo.data){
          const frame=document.createElement('div'); frame.className='print-image-frame';
          const im=document.createElement('img'); im.src=sl.photo.data; frame.appendChild(im); box.appendChild(frame);
          const ty=document.createElement('div'); ty.className='print-shot-type'; ty.textContent=r.layout==='full'?'':(j===0?'作業前':'作業後'); box.appendChild(ty);
          const cm=document.createElement('div'); cm.className='print-shot-comment'; cm.textContent=sl.photo.comment&&sl.photo.comment.trim()?sl.photo.comment:'\u00a0'; box.appendChild(cm);
        }else{
          const emp=document.createElement('div'); emp.className='print-empty-shot';
          if(sl.mode==='text'&&sl.text&&sl.text.trim()){
            const wd=document.createElement('div'); wd.className='print-empty-workdate size-'+(sl.size||'medium'); wd.textContent=sl.text.trim(); emp.appendChild(wd);
          }
          box.appendChild(emp);
          const ty=document.createElement('div'); ty.className='print-shot-type'; ty.textContent=''; box.appendChild(ty);
          const cm=document.createElement('div'); cm.className='print-shot-comment'; box.appendChild(cm);
        }
        gal.appendChild(box);
      });
      row.appendChild(gal); page.appendChild(row);
    });
    root.appendChild(page);
  }
}
async function outputPDF(){
  syncFromDOM();
  document.querySelectorAll('.photo-section').forEach(sec=>{
    const s=current.photoSections.find(x=>x.id===sec.dataset.id);
    if(!s)return;
    const texts=sec.querySelectorAll('.empty-date-fields textarea');const sizes=sec.querySelectorAll('.empty-date-fields select');
    if(texts[0])s.beforeWorkDate=(texts[0].value||'').slice(0,120);if(texts[1])s.afterWorkDate=(texts[1].value||'').slice(0,120);
    if(sizes[0])s.beforeTextSize=sizes[0].value||'medium';if(sizes[1])s.afterTextSize=sizes[1].value||'medium';
  });
  await saveProject(false);
  buildPrintPhotoPages();document.activeElement?.blur?.();document.querySelectorAll('.category-field').forEach(f=>f.classList.toggle('print-empty',!(f.querySelector('.sc')?.value||'').trim()));printReportTitle.textContent=current.reportTitle||'現場検査記録';pName.textContent=normalizeBreaks(current.name||'—');pDate.textContent=current.inspection||'—';pAttendees.textContent=normalizeBreaks(current.attendees||'—');pAuthor.textContent=normalizeBreaks(current.author||'—');document.getElementById('printDate').textContent=(current.inspection||'');{
  const pdfQ=(document.getElementById('pdfQuality')?.value||'standard');

  // 標準：元画像のまま印刷（現在と同等の約25MBクラス）
  if(pdfQ==='standard'){
    const printImgs=[...document.querySelectorAll('#printPhotoPages .print-image-frame img')];
    await Promise.all(printImgs.map(img=>new Promise(resolve=>{
      if(img.complete&&img.naturalWidth>0){
        if(img.decode) img.decode().catch(()=>{}).finally(resolve); else resolve();
      }else{
        const done=()=>resolve(); img.addEventListener('load',done,{once:true}); img.addEventListener('error',done,{once:true});
      }
    })));
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    setTimeout(()=>window.print(),150);
    return;
  }

  // 低容量：PDFに実際に出る印刷用ページの画像だけを圧縮画像へ置換
  // 元の保存写真は一切変更しない
  const printImgs=[...document.querySelectorAll('#printPhotoPages .print-shot img')];
  await Promise.all(printImgs.map(async img=>{
    try{
      const compressed=await compressForPDF(img.src,560,.26);
      img.src=compressed;
      if(img.decode) await img.decode().catch(()=>{});
    }catch(e){ console.error('PDF low-size compression failed',e); }
  }));

  // ブラウザに圧縮画像の描画を確実に完了させてから印刷
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  setTimeout(()=>window.print(),150);
}}
if('serviceWorker' in navigator)window.addEventListener('load',async()=>{try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();if('caches' in window)for(const k of await caches.keys())await caches.delete(k);}catch(e){console.error(e)}});
openDB().then(()=>{setBadge();renderList()}).catch(()=>alert('端末保存を利用できません。Safariで開いてください。'));
</script>
